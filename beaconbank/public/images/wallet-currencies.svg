<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#f0fdf4"/>
  <rect width="400" height="400" fill="url(#walletGrad)"/>

  <!-- Main Wallet -->
  <rect x="60" y="100" width="280" height="200" rx="20" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="drop-shadow(0 10px 25px rgba(16, 185, 129, 0.15))"/>

  <!-- Wallet Header -->
  <rect x="60" y="100" width="280" height="50" rx="20 20 0 0" fill="#10b981"/>
  <text x="80" y="135" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">Multi-Currency Wallet</text>

  <!-- Currency Cards (Stacked appearance) -->
  <!-- USD Card -->
  <rect x="80" y="170" width="70" height="100" rx="8" fill="#10b981" opacity="0.9"/>
  <text x="95" y="195" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">USD</text>
  <text x="95" y="220" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff">$24.5K</text>
  <text x="95" y="245" font-family="Arial" font-size="11" fill="#ffffff">United States</text>

  <!-- EUR Card -->
  <rect x="165" y="160" width="70" height="100" rx="8" fill="#10b981" opacity="0.7"/>
  <text x="180" y="185" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">EUR</text>
  <text x="180" y="210" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff">€18.2K</text>
  <text x="180" y="235" font-family="Arial" font-size="11" fill="#ffffff">Europe</text>

  <!-- GBP Card -->
  <rect x="250" y="150" width="70" height="100" rx="8" fill="#10b981" opacity="0.5"/>
  <text x="265" y="175" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">GBP</text>
  <text x="265" y="200" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff">£15.8K</text>
  <text x="265" y="225" font-family="Arial" font-size="11" fill="#ffffff">United Kingdom</text>

  <!-- Total Balance -->
  <text x="80" y="310" font-family="Arial" font-size="12" fill="#666666">Total Balance (in USD)</text>
  <text x="80" y="335" font-family="Arial" font-size="24" font-weight="bold" fill="#10b981">$58,456.90</text>
</svg>