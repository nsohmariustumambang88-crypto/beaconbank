<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="recoveryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#f0fdf4"/>
  <rect width="400" height="400" fill="url(#recoveryGrad)"/>

  <!-- Recovery Arrow (Circular) -->
  <circle cx="200" cy="200" r="80" fill="none" stroke="#10b981" stroke-width="2" opacity="0.3"/>
  <path d="M 200 120 A 80 80 0 1 1 195 120" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <polygon points="195,120 185,130 200,140" fill="#10b981"/>

  <!-- Money Stack -->
  <rect x="160" y="180" width="80" height="15" rx="3" fill="#10b981"/>
  <rect x="160" y="200" width="80" height="15" rx="3" fill="#10b981" opacity="0.7"/>
  <rect x="160" y="220" width="80" height="15" rx="3" fill="#10b981" opacity="0.5"/>

  <!-- Check Mark (Recovery Success) -->
  <circle cx="280" cy="140" r="25" fill="none" stroke="#10b981" stroke-width="2"/>
  <path d="M 270 145 L 280 155 L 295 135" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Stats -->
  <text x="100" y="310" font-family="Arial" font-size="14" font-weight="bold" fill="#10b981">$15M</text>
  <text x="100" y="330" font-family="Arial" font-size="11" fill="#666666">Recovered</text>

  <text x="200" y="310" font-family="Arial" font-size="14" font-weight="bold" fill="#10b981">2,450</text>
  <text x="200" y="330" font-family="Arial" font-size="11" fill="#666666">Cases</text>

  <text x="280" y="310" font-family="Arial" font-size="14" font-weight="bold" fill="#10b981">87%</text>
  <text x="280" y="330" font-family="Arial" font-size="11" fill="#666666">Success Rate</text>
</svg>