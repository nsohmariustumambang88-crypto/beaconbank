<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="marketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.08" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#f0fdf4"/>
  <rect width="400" height="400" fill="url(#marketGrad)"/>

  <!-- Store 1 (Left) -->
  <rect x="40" y="80" width="100" height="140" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <rect x="40" y="80" width="100" height="40" fill="#10b981"/>
  <text x="90" y="108" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Store 1</text>
  <text x="90" y="155" font-family="Arial" font-size="28" text-anchor="middle">🛍️</text>
  <text x="90" y="210" font-family="Arial" font-size="10" fill="#666666" text-anchor="middle">Online Shop</text>

  <!-- Store 2 (Center) -->
  <rect x="150" y="60" width="100" height="160" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2.5" filter="drop-shadow(0 5px 15px rgba(16, 185, 129, 0.2))"/>
  <rect x="150" y="60" width="100" height="40" fill="#10b981" opacity="0.9"/>
  <text x="200" y="88" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Featured</text>
  <text x="200" y="145" font-family="Arial" font-size="28" text-anchor="middle">⭐</text>
  <text x="200" y="210" font-family="Arial" font-size="10" fill="#666666" text-anchor="middle">Top Seller</text>

  <!-- Store 3 (Right) -->
  <rect x="260" y="80" width="100" height="140" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <rect x="260" y="80" width="100" height="40" fill="#10b981" opacity="0.7"/>
  <text x="310" y="108" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Store 3</text>
  <text x="310" y="155" font-family="Arial" font-size="28" text-anchor="middle">🎯</text>
  <text x="310" y="210" font-family="Arial" font-size="10" fill="#666666" text-anchor="middle">New Shop</text>

  <!-- Connection Lines -->
  <path d="M 140 150 L 160 150" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.5"/>
  <path d="M 250 150 L 260 150" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.5"/>

  <!-- Central Hub -->
  <circle cx="200" cy="280" r="40" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="2"/>
  <text x="200" y="290" font-family="Arial" font-size="24" text-anchor="middle">🏪</text>

  <!-- Connection to hub -->
  <path d="M 90 220 L 170 240" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
  <path d="M 200 220 L 200 240" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
  <path d="M 310 220 L 230 240" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>

  <!-- Stats -->
  <text x="70" y="340" font-family="Arial" font-size="13" font-weight="bold" fill="#10b981">2,500+</text>
  <text x="70" y="358" font-family="Arial" font-size="10" fill="#666666">Sellers</text>

  <text x="200" y="340" font-family="Arial" font-size="13" font-weight="bold" fill="#10b981">$450M</text>
  <text x="200" y="358" font-family="Arial" font-size="10" fill="#666666" text-anchor="middle">Total Sales</text>

  <text x="330" y="340" font-family="Arial" font-size="13" font-weight="bold" fill="#10b981">0%</text>
  <text x="330" y="358" font-family="Arial" font-size="10" fill="#666666">Commission*</text>
</svg>