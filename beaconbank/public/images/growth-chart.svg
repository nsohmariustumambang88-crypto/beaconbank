<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#f0fdf4"/>

  <!-- Grid -->
  <line x1="50" y1="350" x2="350" y2="350" stroke="#d1fae5" stroke-width="2"/>
  <line x1="50" y1="50" x2="50" y2="350" stroke="#d1fae5" stroke-width="2"/>
  <line x1="50" y1="300" x2="350" y2="300" stroke="#e0f2fe" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="250" x2="350" y2="250" stroke="#e0f2fe" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="200" x2="350" y2="200" stroke="#e0f2fe" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="150" x2="350" y2="150" stroke="#e0f2fe" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="100" x2="350" y2="100" stroke="#e0f2fe" stroke-width="1" opacity="0.5"/>

  <!-- Chart Area Fill -->
  <path d="M 50 350 L 100 280 L 150 220 L 200 160 L 250 120 L 300 100 L 350 80 L 350 350 Z" fill="url(#chartGrad)"/>

  <!-- Chart Line -->
  <polyline points="50,350 100,280 150,220 200,160 250,120 300,100 350,80" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data Points -->
  <circle cx="50" cy="350" r="5" fill="#10b981"/>
  <circle cx="100" cy="280" r="5" fill="#10b981"/>
  <circle cx="150" cy="220" r="5" fill="#10b981"/>
  <circle cx="200" cy="160" r="5" fill="#10b981"/>
  <circle cx="250" cy="120" r="5" fill="#10b981"/>
  <circle cx="300" cy="100" r="5" fill="#10b981"/>
  <circle cx="350" cy="80" r="5" fill="#10b981"/>

  <!-- Axis Labels -->
  <text x="30" y="360" font-family="Arial" font-size="12" fill="#666666">Q1</text>
  <text x="90" y="375" font-family="Arial" font-size="12" fill="#666666">Q2</text>
  <text x="150" y="375" font-family="Arial" font-size="12" fill="#666666">Q3</text>
  <text x="210" y="375" font-family="Arial" font-size="12" fill="#666666">Q4</text>
  <text x="270" y="375" font-family="Arial" font-size="12" fill="#666666">Q5</text>
  <text x="330" y="375" font-family="Arial" font-size="12" fill="#666666">Q6</text>

  <!-- Title -->
  <text x="50" y="35" font-family="Arial" font-size="16" font-weight="bold" fill="#10b981">Revenue Growth</text>
  <text x="50" y="55" font-family="Arial" font-size="12" fill="#666666">+340% Year-over-Year</text>
</svg>