<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="refundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.08" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#f0fdf4"/>
  <rect width="400" height="400" fill="url(#refundGrad)"/>

  <!-- Process Flow -->
  <!-- Step 1: Order -->
  <circle cx="100" cy="100" r="30" fill="#10b981" opacity="0.8"/>
  <text x="100" y="110" font-family="Arial" font-size="20" fill="#ffffff" text-anchor="middle">📦</text>
  <text x="100" y="150" font-family="Arial" font-size="11" fill="#666666" text-anchor="middle">Order</text>

  <!-- Arrow 1 -->
  <path d="M 130 100 L 170 100" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981" />
    </marker>
  </defs>

  <!-- Step 2: Request -->
  <circle cx="200" cy="100" r="30" fill="#10b981" opacity="0.8"/>
  <text x="200" y="110" font-family="Arial" font-size="20" fill="#ffffff" text-anchor="middle">🔄</text>
  <text x="200" y="150" font-family="Arial" font-size="11" fill="#666666" text-anchor="middle">Request</text>

  <!-- Arrow 2 -->
  <path d="M 270 100 L 310 100" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 3: Process -->
  <circle cx="300" cy="100" r="30" fill="#10b981" opacity="0.8"/>
  <text x="300" y="110" font-family="Arial" font-size="20" fill="#ffffff" text-anchor="middle">⚙️</text>
  <text x="300" y="150" font-family="Arial" font-size="11" fill="#666666" text-anchor="middle">Process</text>

  <!-- Vertical Arrow Down -->
  <path d="M 200 130 L 200 170" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)" transform="rotate(90 200 150)"/>

  <!-- Step 4: Refund -->
  <circle cx="200" cy="250" r="30" fill="#10b981" opacity="0.9"/>
  <text x="200" y="260" font-family="Arial" font-size="20" fill="#ffffff" text-anchor="middle">💰</text>
  <text x="200" y="300" font-family="Arial" font-size="11" fill="#666666" text-anchor="middle">Refunded</text>

  <!-- Automated indicator -->
  <rect x="80" y="320" width="240" height="50" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <text x="200" y="340" font-family="Arial" font-size="13" font-weight="bold" fill="#10b981" text-anchor="middle">Fully Automated Process</text>
  <text x="200" y="358" font-family="Arial" font-size="11" fill="#666666" text-anchor="middle">Average time: 47 seconds</text>
</svg>