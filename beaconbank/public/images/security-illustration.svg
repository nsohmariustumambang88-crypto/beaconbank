<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#f0fdf4"/>
  <rect width="400" height="400" fill="url(#secGrad)"/>

  <!-- Main Shield -->
  <path d="M 200 80 L 280 120 L 280 200 Q 280 280 200 320 Q 120 280 120 200 L 120 120 Z" fill="none" stroke="#10b981" stroke-width="3"/>

  <!-- Inner Shield (Locked) -->
  <path d="M 200 100 L 260 130 L 260 200 Q 260 260 200 290 Q 140 260 140 200 L 140 130 Z" fill="#10b981" opacity="0.15"/>

  <!-- Lock Symbol -->
  <rect x="170" y="160" width="60" height="70" rx="8" fill="none" stroke="#10b981" stroke-width="2"/>
  <path d="M 180 160 Q 180 140 200 140 Q 220 140 220 160" fill="none" stroke="#10b981" stroke-width="2"/>
  <circle cx="200" cy="205" r="4" fill="#10b981"/>

  <!-- Check Marks -->
  <g>
    <path d="M 240 250 L 250 260 L 260 245" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Encryption Lines -->
  <line x1="100" y1="340" x2="300" y2="340" stroke="#10b981" stroke-width="1" opacity="0.3"/>
  <circle cx="110" cy="340" r="3" fill="#10b981"/>
  <circle cx="200" cy="340" r="3" fill="#10b981"/>
  <circle cx="290" cy="340" r="3" fill="#10b981"/>
</svg>