<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="transferGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.08" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#f0fdf4"/>
  <rect width="400" height="400" fill="url(#transferGrad)"/>

  <!-- Globe -->
  <circle cx="200" cy="160" r="70" fill="none" stroke="#10b981" stroke-width="2" opacity="0.3"/>
  <circle cx="200" cy="160" r="60" fill="none" stroke="#10b981" stroke-width="1" opacity="0.2"/>

  <!-- Continents (simplified) -->
  <path d="M 160 140 Q 170 145 175 135" fill="none" stroke="#10b981" stroke-width="2"/>
  <path d="M 225 150 Q 240 155 235 170" fill="none" stroke="#10b981" stroke-width="2"/>
  <path d="M 185 185 Q 195 195 205 190" fill="none" stroke="#10b981" stroke-width="2"/>

  <!-- Transfer Arrows (Flying Money) -->
  <!-- From left -->
  <path d="M 100 160 Q 150 140 200 160" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <circle cx="90" cy="160" r="15" fill="#10b981" opacity="0.8"/>
  <text x="83" y="167" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff">$</text>

  <!-- To right -->
  <path d="M 200 160 Q 250 180 300 160" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <circle cx="310" cy="160" r="15" fill="#10b981" opacity="0.6"/>
  <text x="303" y="167" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff">€</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981" />
    </marker>
  </defs>

  <!-- Speed indicator -->
  <text x="200" y="260" font-family="Arial" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle">0.8 Seconds</text>
  <text x="200" y="280" font-family="Arial" font-size="12" fill="#666666" text-anchor="middle">Settlement Time</text>

  <!-- Countries -->
  <text x="90" y="310" font-family="Arial" font-size="11" fill="#666666" text-anchor="middle">USA</text>
  <text x="310" y="310" font-family="Arial" font-size="11" fill="#666666" text-anchor="middle">Europe</text>

  <!-- Checkmark (Success) -->
  <circle cx="200" cy="340" r="18" fill="none" stroke="#10b981" stroke-width="2"/>
  <path d="M 192 340 L 198 346 L 210 334" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>